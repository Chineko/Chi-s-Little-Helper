name: RC14 Home Tools Hotfix

on:
  push:
    branches: [main]
    paths:
      - .maintenance/home-tools-request

permissions:
  contents: write
  actions: write

jobs:
  patch-release:
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: com.chineko.chis-little-helper
      PACKAGE_PATH: Packages/com.chineko.chis-little-helper
      VERSION: 1.0.0-rc.14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Home tool directory and bump version
        shell: python
        run: |
          from pathlib import Path
          import json

          pkg = Path("Packages/com.chineko.chis-little-helper")
          editor = pkg / "Editor"

          module = editor / "ChiLittleHelper.HomeToolDirectory.cs"
          module.write_text(r'''using System;
          using System.Collections.Generic;
          using UnityEditor;
          using UnityEngine;

          public partial class ChiLittleHelperWindow
          {
              void DrawHomeToolDirectory()
              {
                  EditorGUILayout.LabelField("All Tools", new GUIStyle(EditorStyles.boldLabel)
                  {
                      normal = { textColor = ColLavenderText },
                      fontSize = 13
                  });

                  EditorGUILayout.LabelField(
                      "Every module is available here as well as in the category tabs above.",
                      styleCardSubtitle);

                  GUILayout.Space(6);

                  for (int categoryIndex = 0; categoryIndex < CategoryLabels.Length; categoryIndex++)
                  {
                      var visible = new List<int>();
                      int[] ids = CategoryToolIds[categoryIndex];
                      string[] labels = CategoryToolLabels[categoryIndex];

                      for (int i = 0; i < ids.Length; i++)
                      {
                          int id = ids[i];
                          if (!enableVRCFuryFeatures && IsVRCFuryTool(id))
                              continue;
                          visible.Add(i);
                      }

                      if (visible.Count == 0)
                          continue;

                      EditorGUILayout.LabelField(CategoryLabels[categoryIndex], new GUIStyle(EditorStyles.boldLabel)
                      {
                          normal = { textColor = ColTextPrimary },
                          fontSize = 11
                      });

                      GUILayout.Space(3);

                      for (int row = 0; row < visible.Count; row += 2)
                      {
                          BeginResponsiveButtonRow();

                          int firstIndex = visible[row];
                          DrawHomeToolDirectoryButton(
                              categoryIndex,
                              ids[firstIndex],
                              labels[firstIndex]);

                          if (row + 1 < visible.Count)
                          {
                              ResponsiveButtonGap();
                              int secondIndex = visible[row + 1];
                              DrawHomeToolDirectoryButton(
                                  categoryIndex,
                                  ids[secondIndex],
                                  labels[secondIndex]);
                          }

                          EndResponsiveButtonRow();
                          GUILayout.Space(4);
                      }

                      GUILayout.Space(5);
                  }
              }

              void DrawHomeToolDirectoryButton(int categoryIndex, int toolId, string label)
              {
                  bool requiresAvatar = toolId != 12 && toolId != 16;

                  using (new EditorGUI.DisabledScope(requiresAvatar && avatar == null))
                  {
                      if (GUILayout.Button(
                          label,
                          styleBtnDark,
                          GUILayout.Height(30),
                          GUILayout.MinWidth(0),
                          GUILayout.ExpandWidth(true)))
                      {
                          RouteToTool(categoryIndex, toolId);
                      }
                  }
              }
          }
          ''', encoding="utf-8")

          home = editor / "ChiLittleHelper.HomePreferences.cs"
          text = home.read_text(encoding="utf-8")
          anchor = '''        GUILayout.Space(5);
                  if (GUILayout.Button("Preset Library v2", styleBtnDark, GUILayout.Height(32)))
                      RouteToTool(0, 16);

                  EndCard();'''
          replacement = '''        GUILayout.Space(5);
                  if (GUILayout.Button("Preset Library v2", styleBtnDark, GUILayout.Height(32)))
                      RouteToTool(0, 16);

                  GUILayout.Space(12);
                  DrawHomeToolDirectory();

                  EndCard();'''
          if anchor not in text:
              raise SystemExit("Home quick-action anchor not found")
          home.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")

          main = editor / "ChiLittleHelperWindow.cs"
          text = main.read_text(encoding="utf-8")
          old = 'public const string TOOL_VERSION = "1.0.0-rc.13";'
          new = 'public const string TOOL_VERSION = "1.0.0-rc.14";'
          if old not in text:
              raise SystemExit("TOOL_VERSION rc.13 not found")
          main.write_text(text.replace(old, new, 1), encoding="utf-8")

          package_json = pkg / "package.json"
          data = json.loads(package_json.read_text(encoding="utf-8"))
          data["version"] = "1.0.0-rc.14"
          package_json.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          changelog = pkg / "CHANGELOG.md"
          text = changelog.read_text(encoding="utf-8")
          entry = '''# Changelog

          ## 1.0.0-rc.14
          - Added an **All Tools** directory to Home so every module is visible from the main page, not only the curated Quick Actions.
          - Tools are grouped under Build, Dynamics, Materials, Optimize and Doctor and route to the same module pages as the category navigation.
          - VRCFury-only tools respect the existing **Show VRCFury Features** preference.
          - Avatar-dependent tools are disabled when no avatar is selected; Material Assembler and Preset Library remain available without an avatar.
          - The tool directory uses the responsive button layout so compact windows stack safely without horizontal overflow.

          '''
          if text.startswith("# Changelog\n"):
              text = entry + text[len("# Changelog\n\n"):]
          else:
              text = entry + text
          changelog.write_text(text, encoding="utf-8")

          root_readme = Path("README.md")
          if root_readme.exists():
              text = root_readme.read_text(encoding="utf-8")
              text = text.replace("Current package release: **1.0.0-rc.13**", "Current package release: **1.0.0-rc.14**")
              root_readme.write_text(text, encoding="utf-8")

      - name: Validate patch
        shell: bash
        run: |
          grep -q 'TOOL_VERSION = "1.0.0-rc.14"' "$PACKAGE_PATH/Editor/ChiLittleHelperWindow.cs"
          grep -q 'DrawHomeToolDirectory();' "$PACKAGE_PATH/Editor/ChiLittleHelper.HomePreferences.cs"
          test -f "$PACKAGE_PATH/Editor/ChiLittleHelper.HomeToolDirectory.cs"
          test "$(jq -r '.version' "$PACKAGE_PATH/package.json")" = "$VERSION"

      - name: Commit RC14 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages/com.chineko.chis-little-helper README.md
          git commit -m "Fix Home tool directory and bump RC14"
          git push origin HEAD:main

      - name: Build VPM ZIP
        shell: bash
        run: |
          cd "$PACKAGE_PATH"
          zip -r "$GITHUB_WORKSPACE/${PACKAGE_NAME}-${VERSION}.zip" . \
            -x '*.DS_Store' -x '*/.DS_Store'

      - name: Publish RC14 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Chi's Little Helper ${{ env.VERSION }}
          target_commitish: main
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ env.PACKAGE_NAME }}-${{ env.VERSION }}.zip
            ${{ env.PACKAGE_PATH }}/package.json

      - name: Request VPM listing rebuild
        shell: bash
        run: |
          git pull --rebase origin main
          mkdir -p .listing
          echo "Build VPM listing for ${VERSION}" > .listing/REQUEST
          git add .listing/REQUEST
          if git diff --cached --quiet; then
            echo "Listing request already current."
          else
            git commit -m "Build VPM listing for RC14"
            git push origin HEAD:main
          fi
