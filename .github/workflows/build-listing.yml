name: Build Repo Listing

on:
  workflow_dispatch:
  push:
    paths:
      - .listing/REQUEST
  workflow_run:
    workflows: [Build Release]
    types: [completed]
  release:
    types: [published, created, edited, unpublished, deleted, released]

permissions:
  contents: write

concurrency:
  group: vpm-listing
  cancel-in-progress: true

env:
  PACKAGE_NAME: com.chineko.chis-little-helper
  LIST_PUBLISH_DIRECTORY: Website
  CI_PATH: ci
  RAW_LISTING_URL: https://raw.githubusercontent.com/Chineko/Chi-s-Little-Helper/main/Website/index.json

jobs:
  build-listing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout package repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout VRChat package listing automation
        uses: actions/checkout@v4
        with:
          repository: vrchat-community/package-list-action
          path: ${{ env.CI_PATH }}
          clean: false

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CI_PATH }}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}

      - name: Build VPM listing
        shell: bash
        run: >-
          ${{ env.CI_PATH }}/build.cmd BuildRepoListing
          --root ${{ env.CI_PATH }}
          --list-publish-directory $GITHUB_WORKSPACE/${{ env.LIST_PUBLISH_DIRECTORY }}
          --current-package-name ${{ env.PACKAGE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set canonical raw listing URL
        shell: bash
        run: |
          jq --arg url "$RAW_LISTING_URL" '.url = $url' Website/index.json > Website/index.json.tmp
          mv Website/index.json.tmp Website/index.json

      - name: Commit VPM listing
        shell: bash
        run: |
          cp Website/index.json /tmp/vpm-index.json
          rm -rf "$CI_PATH"

          git fetch origin main
          git reset --hard origin/main

          mkdir -p Website
          cp /tmp/vpm-index.json Website/index.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Website/index.json

          if git diff --cached --quiet; then
            echo "VPM listing is already up to date."
          else
            git commit -m "Update VPM repository listing"
            git push origin HEAD:main
          fi
