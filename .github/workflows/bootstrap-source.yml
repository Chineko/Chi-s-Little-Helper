name: Bootstrap RC13 Source

on:
  push:
    paths:
      - .bootstrap/READY

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct RC13 archive
        shell: bash
        run: |
          cat .bootstrap/part-*.b64 | base64 --decode --ignore-garbage > /tmp/chi-rc13.zip
          mkdir -p /tmp/chi-rc13
          unzip -q /tmp/chi-rc13.zip -d /tmp/chi-rc13

      - name: Import package source
        shell: bash
        run: |
          SRC=/tmp/chi-rc13/ChiLittleHelper_1.0_RC13
          DST=Packages/com.chineko.chis-little-helper

          test -d "$SRC/Editor"
          rm -rf "$DST/Editor"
          cp -R "$SRC/Editor" "$DST/Editor"
          cp "$SRC/CHANGELOG.md" "$DST/CHANGELOG.md"
          cp LICENSE "$DST/LICENSE.md"

      - name: Generate stable Unity meta files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('Packages/com.chineko.chis-little-helper')

          def guid(rel):
              return hashlib.md5(('ChiLittleHelper:' + rel.replace('\\', '/')).encode('utf-8')).hexdigest()

          editor = root / 'Editor'
          editor_meta = root / 'Editor.meta'
          editor_meta.write_text(
              'fileFormatVersion: 2\n'
              f'guid: {guid("Editor")}\n'
              'folderAsset: yes\n'
              'DefaultImporter:\n'
              '  externalObjects: {}\n'
              '  userData: \n'
              '  assetBundleName: \n'
              '  assetBundleVariant: \n',
              encoding='utf-8')

          for path in sorted(editor.iterdir()):
              if not path.is_file() or path.suffix == '.meta':
                  continue

              rel = path.relative_to(root).as_posix()
              meta = Path(str(path) + '.meta')

              if path.suffix == '.cs':
                  body = (
                      'fileFormatVersion: 2\n'
                      f'guid: {guid(rel)}\n'
                      'MonoImporter:\n'
                      '  externalObjects: {}\n'
                      '  serializedVersion: 2\n'
                      '  defaultReferences: []\n'
                      '  executionOrder: 0\n'
                      '  icon: {instanceID: 0}\n'
                      '  userData: \n'
                      '  assetBundleName: \n'
                      '  assetBundleVariant: \n'
                  )
              elif path.suffix == '.asmdef':
                  body = (
                      'fileFormatVersion: 2\n'
                      f'guid: {guid(rel)}\n'
                      'AssemblyDefinitionImporter:\n'
                      '  externalObjects: {}\n'
                      '  userData: \n'
                      '  assetBundleName: \n'
                      '  assetBundleVariant: \n'
                  )
              else:
                  continue

              meta.write_text(body, encoding='utf-8')
          PY

      - name: Remove bootstrap payload
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit imported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Chi's Little Helper RC13 package source"
          git push
