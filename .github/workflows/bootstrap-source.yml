name: Bootstrap RC13 Source

on:
  push:
    paths:
      - .bootstrap/READY

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct RC13 archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          expected = {
              'part-01.b64': '5709f5b7a62f7f2d780039acad5b2c24065112e801eb0ba3a4b0ce7f8d958c28',
              'part-02.b64': 'e514b240afa1810433417ca7ea04571d608a7136d8f0f1cfb532fe5f199aab75',
              'part-03.b64': 'e3aef5d759a8671c639789cfecc990018a901bd57632ec20aeca421a2e3d9cd2',
              'part-04.b64': '267d31c757b6ad8a08f73a214a6f5aa1d8db3f220394c6e443c15a3fdf487f45',
              'part-05.b64': '073cbbb45213c1a9084e45a9dbb59abf43e7785308db620f5e27f0276bac8536',
              'part-06.b64': 'bea835cd0a956ec7cbbce77baa05617625592b3a3b8b3f05875787c3e7ff38fc',
              'part-07.b64': '57b45eba85aef6f09e12e293eef9412939468dfded12b460cbb2fc8141f4343d',
              'part-08.b64': 'c21d46d5ba69475822e2430f456e5822e49d70f8f0e7429d946028cf753c6155',
              'part-09.b64': 'afe12f6aebc8f21d8ccac57df9e16c455086e54cde89e60bab0c902651441c54',
              'part-10.b64': '8efc576bdac6f5d529ce05a375b12b5b03773d067d9e1e640b9019a6dd7bd9c6',
              'part-11.b64': '726b517d1858dccbfd92733eda5737fcd5c3a273e3aaa0deca71eedf39826cee',
              'part-12.b64': '2132fca9b630cbad04da05cf416d3348b0eb2ffeac6f34900e4c1832d65524b6',
              'part-13.b64': 'c768090a9f436e375fa5e9ab6e07a1a4245bd4be3da702aac25724926750ef9c',
              'part-14.b64': '16bc11b01b4e52b5b7795842efb3f37280b3ded22da633a164f1c654727079fd',
              'part-15.b64': 'f55e8be8c4e9fa3b5e9d7a21eadf7fe2d7baf97ebdbaee76cd97b60f3d630d28',
              'part-16.b64': 'a3d1c071dfe71bf7b77ef5375dcd27ca43d5cccad7cf22d84ac56c58677feb42',
          }

          fixed09 = ''.join(
              (Path('.bootstrap') / f'fix09-{i:02d}.b64').read_text(encoding='utf-8').strip()
              for i in range(1, 5)
          )
          assert len(fixed09) == 12000, f'Unexpected fixed part 09 length: {len(fixed09)}'
          assert hashlib.sha256(fixed09.encode('utf-8')).hexdigest() == expected['part-09.b64'], 'Fixed part 09 hash mismatch'

          chunks = []
          for i in range(1, 17):
              name = f'part-{i:02d}.b64'
              if name == 'part-09.b64':
                  text = fixed09
              else:
                  text = (Path('.bootstrap') / name).read_text(encoding='utf-8').strip()

              digest = hashlib.sha256(text.encode('utf-8')).hexdigest()
              assert digest == expected[name], f'{name} hash mismatch: {digest}'
              chunks.append(text)
              print(f'{name}: OK')

          data = ''.join(chunks)
          assert len(data) == 184104, f'Unexpected payload length: {len(data)}'
          Path('/tmp/chi-rc13.zip').write_bytes(base64.b64decode(data, validate=True))
          print(f'Reconstructed verified RC13 archive ({len(data)} base64 chars)')
          PY
          mkdir -p /tmp/chi-rc13
          unzip -tq /tmp/chi-rc13.zip
          unzip -q /tmp/chi-rc13.zip -d /tmp/chi-rc13

      - name: Import package source
        shell: bash
        run: |
          SRC=/tmp/chi-rc13/ChiLittleHelper_1.0_RC13
          DST=Packages/com.chineko.chis-little-helper

          test -d "$SRC/Editor"
          rm -rf "$DST/Editor"
          cp -R "$SRC/Editor" "$DST/Editor"
          cp "$SRC/CHANGELOG.md" "$DST/CHANGELOG.md"
          cp LICENSE "$DST/LICENSE.md"

      - name: Generate stable Unity meta files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('Packages/com.chineko.chis-little-helper')

          def guid(rel):
              return hashlib.md5(('ChiLittleHelper:' + rel.replace('\\', '/')).encode('utf-8')).hexdigest()

          editor = root / 'Editor'
          (root / 'Editor.meta').write_text(
              'fileFormatVersion: 2\n'
              f'guid: {guid("Editor")}\n'
              'folderAsset: yes\n'
              'DefaultImporter:\n'
              '  externalObjects: {}\n'
              '  userData: \n'
              '  assetBundleName: \n'
              '  assetBundleVariant: \n',
              encoding='utf-8')

          for path in sorted(editor.iterdir()):
              if not path.is_file() or path.suffix == '.meta':
                  continue
              rel = path.relative_to(root).as_posix()
              meta = Path(str(path) + '.meta')
              if path.suffix == '.cs':
                  body = (
                      'fileFormatVersion: 2\n'
                      f'guid: {guid(rel)}\n'
                      'MonoImporter:\n'
                      '  externalObjects: {}\n'
                      '  serializedVersion: 2\n'
                      '  defaultReferences: []\n'
                      '  executionOrder: 0\n'
                      '  icon: {instanceID: 0}\n'
                      '  userData: \n'
                      '  assetBundleName: \n'
                      '  assetBundleVariant: \n'
                  )
              elif path.suffix == '.asmdef':
                  body = (
                      'fileFormatVersion: 2\n'
                      f'guid: {guid(rel)}\n'
                      'AssemblyDefinitionImporter:\n'
                      '  externalObjects: {}\n'
                      '  userData: \n'
                      '  assetBundleName: \n'
                      '  assetBundleVariant: \n'
                  )
              else:
                  continue
              meta.write_text(body, encoding='utf-8')
          PY

      - name: Remove bootstrap payload
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit imported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Chi's Little Helper RC13 package source"
          git push
